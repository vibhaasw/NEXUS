[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-mod"
version = "0.1.0"
description = "Local push-to-talk voice control prototype using RealtimeSTT and Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ollama",
  "RealtimeSTT",
  "faster-whisper",
  "silero-vad",
  "voice-mod-handlers",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
voice-mod = "voice_control.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
